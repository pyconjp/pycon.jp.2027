<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャンペーンLP集</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#F4F6F5;--card:#fff;--ink:#14213D;--sub:#5A6474;--acc:#1688D4;--ref:#FF4F00;--tag:#EEF2F4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;line-height:1.7}
a{color:var(--acc)}
[data-lucide]{width:1em;height:1em;stroke-width:2;vertical-align:-.12em}
main{max-width:1240px;margin:0 auto;padding:40px 16px 72px}
h1{margin:0;font-size:26px}
.meta{margin:4px 0 20px;color:var(--sub);font-size:14px}
.filters{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;background:var(--bg)}
.filters button{border:1.5px solid #D5DCE3;background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
h2{display:flex;align-items:center;gap:8px;margin:36px 0 14px;font-size:20px}
h2 small{font-size:13px;font-weight:500;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
.site{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05);display:flex;flex-direction:column}
.site.ref{outline:3px solid var(--ref)}
.shots{position:relative;background:#DDE3E8}
.shots .pc{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.shots .sp{position:absolute;right:10px;bottom:-26px;width:22%;aspect-ratio:390/844;object-fit:cover;object-position:top;border-radius:10px;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.body{padding:14px 18px 18px}
.name{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-weight:900;font-size:17px;padding-right:24%}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--tag);color:var(--sub)}
.badge.ref{background:var(--ref);color:#fff}
.badge.end{background:#FDECEC;color:#B3261E}
.url{font-size:12px;word-break:break-all}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--tag)}
.tags span.hit{background:#FFE9DC;color:#B4400B}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--sub);margin:4px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i.sw{display:inline-block;width:14px;height:14px;border-radius:999px;background:#FFE9DC}
footer{margin-top:40px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<main>
  <h1>キャンペーンLP集</h1>
  <p class="meta">参考の PBR LENDING 3周年感謝祭と、公開中のキャンペーンLP 10件。PC 1280×800 / スマホ 390×844 で 2026-10-16 に撮影。候補は <a href="https://lp.webdesignclip.com/">Web Design Clip（LP）</a>、各社のキャンペーン一覧、Web検索から選びました。</p>
  <p class="legend"><span><i class="sw"></i>参考LPと共通する要素</span></p>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
  <footer>bitbank 仮想通貨の夏祭りWキャンペーンは2022年の終了済みページですが、参考LPと同じ暗号資産の特典LPなので残しています。PayPay の3件はスマホ幅の縦長バナーをPCでも中央に置く作りです。</footer>
</main>
<script>
const PATTERNS = {
  ref: { title: '参考', note: '' },
  big: { title: '特典の数字を最大に', note: '金額やポイント数を画面でいちばん大きな文字にする' },
  cards: { title: '特典をカード・コースで並べる', note: '特典や応募コースを箱に入れて並べ、比べられるようにする' },
  world: { title: '人物・世界観が主役', note: '写真やビジュアルで引きつけ、特典は後ろで見せる' },
};
const SITES = [
  { id: 'pbr', p: 'ref', name: 'PBR LENDING 3周年感謝祭', where: '暗号資産', url: 'https://portobelloroad.co.jp/lp/3rd-anniv/user/',
    tags: ['装飾タイポの題字', '特大の期間表示', '光の筋＋3Dオブジェクト', '特典3つのカード', '巨大英字の帯'], ref: true },
  { id: 'bitbank', p: 'big', name: 'bitbank 仮想通貨の夏祭りWキャンペーン', where: '暗号資産', url: 'https://bitbank.cc/campaign/summerfestival2022/', end: true,
    tags: ['「現金最大10,000円」を特大に', '特典2つを箱で並べる', '期間＋カウントダウン', '提灯の夏祭り'], hit: ['「現金最大10,000円」を特大に', '特典2つを箱で並べる', '期間＋カウントダウン'] },
  { id: 'calbee', p: 'big', name: 'Calbee 大収穫祭2026', where: '食品', url: 'https://www.calbee.co.jp/daishukakusai/',
    tags: ['「10万名様に当たる」を極太で', '人物と商品の写真', '締切バッジ', '赤×黄'], hit: ['締切バッジ'] },
  { id: 'mallgacha', p: 'big', name: '楽天ポイントモール モールガチャ', where: 'ポイント', url: 'https://pointmall.rakuten.co.jp/special/cp/2026/261001_mallgacha/',
    tags: ['「10,000ポイント」を特大に', 'ガチャのイラスト世界', '縁取りの太い文字', '毎月開催バッジ'] },
  { id: 'kabu', p: 'big', name: '三菱UFJ eスマート証券 新規口座開設', where: '証券', url: 'https://kabu.com/campaign/20261001_1.html',
    tags: ['「5,000円」を特大に', '記事内のバナー型', '要エントリーバッジ', '紅葉の季節感'] },
  { id: 'meiten', p: 'cards', name: 'エスビー食品「名店の味」キャンペーン', where: '食品', url: 'https://campaign.cp.dline.jp/sbfoodsmeitencp',
    tags: ['金の額縁と25th', 'A〜Dの4コースを並べる', '応募期間を帯で大きく', '人物写真'], hit: ['A〜Dの4コースを並べる', '応募期間を帯で大きく'] },
  { id: 'pp-youth', p: 'cards', name: 'PayPay 12〜25歳の本人確認キャンペーン', where: '決済', url: 'https://paypay.ne.jp/event/youth-ekyc-20261001/',
    tags: ['1,000／500ポイントを2枚のカードで', '対象者バッジ', '期間を黒帯で', '縦長バナー'], hit: ['1,000／500ポイントを2枚のカードで'] },
  { id: 'pp-gift', p: 'cards', name: 'PayPayギフト 最大300ポイント', where: '決済', url: 'https://paypay.ne.jp/event/gift-20260914/',
    tags: ['「3回で最大300pt」', 'ギフト箱の枠', '生成りの地', '対象ブランドのロゴ'] },
  { id: 'pp-scratch', p: 'cards', name: 'PayPay 海外スクラッチくじ', where: '決済', url: 'https://paypay.ne.jp/event/overseas-scratch-20260331/',
    tags: ['「スクラッチくじ」のロゴ', '対象の支払いを図で', '水色基調', '縦長バナー'] },
  { id: 'monaki', p: 'world', name: 'モナキ × ルルルン 限定コラボ Vol.2', where: '化粧品', url: 'https://lululun.com/shop/pages/lululun_monaki2609',
    tags: ['グループの人物写真', '「Vol.2」を縦組み', '英字ロゴの帯', '白基調'] },
  { id: 'mmx', p: 'world', name: 'グッドラックMMX JAXA応援キャンペーン', where: '宇宙', url: 'https://goodluck-mmx.jp/',
    tags: ['宇宙の写真を全面に', 'メッセージを送る参加型', '黒基調', '英語切替'] },
];
const filters = document.getElementById('filters');
const list = document.getElementById('list');
let current = 'all';
const keys = ['all', ...Object.keys(PATTERNS)];
keys.forEach(k => {
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.k = k;
  b.textContent = k === 'all' ? `すべて ${SITES.length}` : `${PATTERNS[k].title} ${SITES.filter(s => s.p === k).length}`;
  b.onclick = () => { current = k; render(); };
  filters.appendChild(b);
});
function card(s) {
  const hit = new Set(s.hit || []);
  return `<article class="site${s.ref ? ' ref' : ''}">
    <div class="shots"><img class="pc" src="img/cp10/${s.id}-pc.jpg" alt="${s.name} のPC表示" loading="lazy"><img class="sp" src="img/cp10/${s.id}-sp.jpg" alt="${s.name} のスマホ表示" loading="lazy"></div>
    <div class="body">
      <div class="name">${s.name}${s.ref ? '<span class="badge ref">参考</span>' : ''}<span class="badge">${s.where}</span>${s.end ? '<span class="badge end">終了</span>' : ''}</div>
      <a class="url" href="${s.url}" target="_blank" rel="noopener">${s.url.replace(/^https?:\/\//, '')}</a>
      <div class="tags">${s.tags.map(t => `<span class="${hit.has(t) ? 'hit' : ''}">${t}</span>`).join('')}</div>
    </div>
  </article>`;
}
function render() {
  filters.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === current));
  list.innerHTML = Object.entries(PATTERNS)
    .filter(([k]) => current === 'all' || current === k)
    .map(([k, v]) => `<h2>${v.title}${v.note ? ` <small>${v.note}</small>` : ''}</h2><div class="grid">${SITES.filter(s => s.p === k).map(card).join('')}</div>`)
    .join('');
}
render();
lucide.createIcons();
</script>
</body>
</html>
