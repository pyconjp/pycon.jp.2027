<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyCon JP 2027 ロゴ文字案</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F9F7;--ink:#0E1E5B;--sub:#3B4A7A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif}
main{max-width:1100px;margin:0 auto;padding:40px 16px 64px}
h1{margin:0 0 4px;font-size:24px}
.meta{margin:0 0 28px;color:var(--sub);font-size:14px}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.opt h2{grid-column:1/-1;margin:0;font-size:18px;display:flex;align-items:center;gap:10px}
.opt h2 span{font-size:12px;font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:2px 10px}
.pane{border-radius:18px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}
.pane img{width:100%;height:100%;object-fit:cover}
.pane.light{background:radial-gradient(ellipse 80% 70% at 50% 45%,#fff,#DAEFEA)}
.pane.light img{mix-blend-mode:multiply}
.pane.photo{background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url(img/web/2026/group-1280.webp) center/cover}
.pane.photo img{mix-blend-mode:multiply}
@media (max-width:760px){.opt{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>PyCon JP 2027 ロゴ文字 3案</h1>
  <p class="meta">nano banana（gemini-3.1-flash-image）で生成 ・ 左: 案Aの背景色 / 右: 写真の上</p>
  <section class="opt"><h2><span>1</span>筆文字＋波のはね</h2>
    <div class="pane light"><img src="img/web/logo/brush.webp" alt="筆文字のロゴ案"></div>
    <div class="pane photo"><img src="img/web/logo/brush.webp" alt=""></div>
  </section>
  <section class="opt"><h2><span>2</span>波と富士のロゴタイプ</h2>
    <div class="pane light"><img src="img/web/logo/wave.webp" alt="波と富士を組み込んだロゴ案"></div>
    <div class="pane photo"><img src="img/web/logo/wave.webp" alt=""></div>
  </section>
  <section class="opt"><h2><span>3</span>レトロ旅行ポスター</h2>
    <div class="pane light"><img src="img/web/logo/retro.webp" alt="レトロな旅行ポスター風のロゴ案"></div>
    <div class="pane photo"><img src="img/web/logo/retro.webp" alt=""></div>
  </section>
</main>
</body>
</html>
