<!doctype html>
<!-- トップの OGP 画像 (1200x630) の元。proposals/img/web/ogp/top.jpg に書き出す -->
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#13213F;--ai:#163A8A;--shu:#E0402A}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#3C7FCB url(../img/variants/sora-clear.jpg) center 78%/cover no-repeat;font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink)}
.clouds{position:absolute;left:0;top:0;width:100%;height:70%;background:url(../img/variants/cloud-tile.webp) left top/auto 100% repeat-x;opacity:.9;
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 55%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0,#000 55%,transparent 100%)}
.center{position:absolute;left:50%;top:44px;translate:-50% 0;display:flex;flex-direction:column;align-items:center;gap:22px}
.lockup{display:block;width:640px;height:auto;filter:drop-shadow(0 0 3px rgba(255,255,255,.9)) drop-shadow(0 0 16px rgba(255,255,255,.8))}
.cta{display:inline-flex;align-items:center;gap:12px;padding:12px 34px;border-radius:999px;background:var(--shu);color:#fff;font-weight:900;font-size:34px;letter-spacing:.06em;box-shadow:0 8px 20px rgba(224,64,42,.35)}
.cta svg{width:34px;height:34px}
</style>
</head>
<body>
<div class="clouds"></div>
<div class="center">
  <img class="lockup" src="../img/logo/lockup-snake-1.png" alt="">
  <span class="cta"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>主催メンバー募集</span>
</div>
</body>
</html>
