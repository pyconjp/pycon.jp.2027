<!doctype html>
<!-- 記事「会場の下見」の OGP 画像 (1200x630) の元。proposals/img/web/ogp/blog-2026-10-venue-visit.jpg に書き出す -->
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7FB;--ink:#13213F;--ink-2:#4A5672;--ai:#163A8A;--shu:#E0402A;--ki:#D6E6FB}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{display:grid;grid-template-columns:640px 1fr;background:var(--bg);font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink)}
.text{display:flex;flex-direction:column;justify-content:space-between;padding:52px 40px 48px 60px}
.logo{display:block;height:58px;width:auto}
.meta{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.meta time{font-family:"Outfit",sans-serif;font-weight:700;font-size:26px;letter-spacing:.06em;color:var(--ink-2)}
.badge{font-weight:700;font-size:20px;color:#fff;background:var(--ai);border-radius:999px;padding:3px 16px}
h1{margin:0;font-size:44px;font-weight:900;line-height:1.42;letter-spacing:.01em;white-space:nowrap}
h1 mark{background:linear-gradient(transparent 64%,var(--ki) 64%);color:inherit;padding:0 .08em}
.venue{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;color:var(--ink-2)}
.venue svg{width:24px;height:24px;color:var(--shu)}
.photo{position:relative;margin:28px 28px 28px 0;border-radius:28px;overflow:hidden;box-shadow:0 8px 24px rgba(19,33,63,.12)}
.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:40% 60%}
</style>
</head>
<body>
<div class="text">
  <img class="logo" src="../img/logo/header-title.png" alt="">
  <div>
    <div class="meta"><time>2026.10.27</time><span class="badge">ブログ</span></div>
    <h1>PyCon JP 2027 の会場、<br><mark>プラサヴェルデ</mark>の<br>下見に行ってきました</h1>
  </div>
  <div class="venue"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>静岡・沼津プラサヴェルデ</div>
</div>
<div class="photo"><img src="../img/blog/2026-10-venue-visit/rooftop.jpg" alt=""></div>
</body>
</html>
